[project]
name = "dn-second-brain-poker-engine"
version = "0.1.0"
description = "FastAPI poker engine for heads-up No-Limit Hold'em."
requires-python = ">=3.10"
dependencies = [
  "fastapi==0.136.1",
  "httpx==0.28.1",
  "pydantic==2.13.4",
  "pytest==9.0.3",
  "treys==0.1.8",
  "uvicorn[standard]==0.47.0"
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"
