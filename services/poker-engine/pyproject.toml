[project]
name = "dn-second-brain-poker-engine"
version = "0.1.0"
description = "Day 1 FastAPI poker engine for heads-up No-Limit Hold'em."
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.104",
  "httpx>=0.27",
  "pydantic>=2",
  "pytest>=8",
  "treys>=0.1.8",
  "uvicorn[standard]>=0.27"
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"
